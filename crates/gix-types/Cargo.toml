[package]
name = "gix-types"
version = "0.1.0"
edition = "2021"
description = "GIX (Glyph Index) canonical primitive types"

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
sha2        = "0.10"
hex         = "0.4"
uuid        = { version = "1", features = ["v4"] }
